name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Linux is where the engines are cheap to install, so the end-to-end tests get
  # to run against real tools instead of skipping themselves.
  test:
    name: test · Linux · real engines
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            ffmpeg ghostscript poppler-utils qpdf \
            tesseract-ocr tesseract-ocr-eng

      # Ubuntu LTS still ships ImageMagick 6, whose front end is `convert`, not
      # `magick`, and whose flags are not the ones Orbit builds. Orbit therefore
      # reports it as unavailable — correctly. Fetching the official ImageMagick 7
      # static build keeps those tests real instead of skipped; if the download
      # fails, the tests skip loudly rather than lying.
      - name: ImageMagick 7 (best effort)
        run: |
          sudo mkdir -p /opt/imagemagick
          sudo curl -fsSL --retry 3 -o /opt/imagemagick/magick \
            https://imagemagick.org/archive/binaries/magick || exit 0
          sudo chmod +x /opt/imagemagick/magick
          echo "/opt/imagemagick" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # A test that skips itself is a test that stopped covering anything. The
      # engines above are installed precisely so that none of them need to.
      - name: Engines the tests actually found
        run: |
          for tool in ffmpeg magick gs pdftoppm pdftotext pdfinfo qpdf tesseract; do
            if command -v "$tool" >/dev/null 2>&1; then
              printf 'yes  %s\n' "$tool"
            else
              printf 'NO   %s\n' "$tool"
            fi
          done

  # The Windows and macOS shells cannot be built on a Linux runner — macOS needs
  # Apple's Objective-C compiler, and Windows needs the MSVC linker. What *can*
  # happen here is the part that catches most breakage: type-checking the whole
  # app against the Windows target, which is where a stray Unix-only call or a
  # missing `cfg` shows up long before a runner spins up.
  cross-check:
    name: check · Windows target
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # tauri-build embeds this; it has to exist before anything is checked.
      - run: npm run build

      - name: Crates that carry no platform code at all
        run: cargo check -p orbit-registry -p orbit-jobs --target x86_64-pc-windows-msvc

      - name: The whole app, Windows target
        run: cargo check -p orbit-app --target x86_64-pc-windows-msvc --features custom-protocol

  # Installers, on the real operating systems. This is the job that turns "it
  # compiles" into "here is the file to run". It runs for main and on demand,
  # because a full bundle on three platforms is not a per-pull-request cost.
  installers:
    name: installers · ${{ matrix.os }}
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle-${{ matrix.os }}

      - run: npm ci

      - name: Bundle
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app/**
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
