name: Release

# Tag `v0.1.0` and this builds the installers on all three platforms and files
# them under a draft release, so the notes can be read before anything ships.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach the installers to
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows · x64
            os: windows-latest
            args: ""
          - name: macOS · Apple silicon
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS · Intel
            os: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux · x64
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: macOS targets
        if: matrix.os == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Orbit ${{ github.event.inputs.tag || github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            A background radial file converter and editor. Drop files on the
            ring, pick a petal, and the result lands beside the source as
            `name (converted).ext` — nothing is uploaded, ever.

            **Install**

            | Platform | File | Notes |
            |---|---|---|
            | Windows 10/11 | `.exe` (NSIS) or `.msi` | Per-user install, no administrator prompt. WebView2 is fetched on first run if the machine does not already have it. |
            | macOS 12+ | `.dmg` | Real Apple silicon and Intel builds. Grant Accessibility permission for the global hotkey. |
            | Linux | `.AppImage`, `.deb`, `.rpm` | Needs `libwebkit2gtk-4.1`. X11 only for global hooks; on Wayland use the tray or bind Orbit in your compositor. |

            **Summon the ring** with the global shortcut
            (`Ctrl`/`⌘` + `Shift` + `Space` by default — change it under
            **tray → Shortcut**), from the tray icon, or by handing Orbit files:
            `orbit-app photo.png`. The Shift-drag-anywhere trigger is the next
            milestone; the ring is already a real drop target.

            Everything runs locally through engines already on your machine
            (FFmpeg, ImageMagick, Ghostscript, …), plus the built-in engine that
            needs nothing at all. No telemetry, no account, no network calls.
